<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" rx="6" fill="#0a0014"/>

  <!-- confetti pixels, matching the page's palette -->
  <rect x="6" y="6" width="6" height="6" fill="#ffd200"/>
  <rect x="52" y="8" width="5" height="5" fill="#00e0ff"/>
  <rect x="8" y="50" width="5" height="5" fill="#39ff14"/>
  <rect x="50" y="50" width="6" height="6" fill="#ff2ec4"/>

  <!-- chunky "W", rendered like the bouncing logo: RGB-split glitch copies + white top -->
  <text x="33" y="46" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="40" fill="#ff004d">W</text>
  <text x="31" y="44" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="40" fill="#00e0ff">W</text>
  <text x="32" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="40" fill="#fff">W</text>
</svg>
